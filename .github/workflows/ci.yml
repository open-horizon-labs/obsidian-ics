name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Loads the actual compiled dist/main.js (and a copy of it in an isolated
      # plugin-folder shape) and calls its real public getEvents() API - not the
      # TypeScript source. Catches the class of bug in #198 where the source and
      # its unit tests were correct but nothing had ever verified the shipped
      # build behaves the same way.
      - name: Compiled artifact contract test
        run: npm run test:dist-artifact

      # The tree is clean, so warnings are gated too - anything new fails here
      # rather than accumulating. This also catches the failure mode that shipped
      # undetected in #225: eslint exits 2 when a dependency change stops it
      # running at all.
      - name: Lint
        run: npx eslint . --max-warnings 0
