name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Errors are gated; warnings are not (there are 57 left). eslint exits 0
      # with warnings only, 1 on any error, and 2 when it can't run at all - so
      # this also catches the failure mode that shipped undetected in #225, a
      # dependency change that makes eslint itself blow up.
      - name: Lint
        run: npx eslint .
